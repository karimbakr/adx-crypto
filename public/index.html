<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AdX Crypto — MiniApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <div style="font-weight:800; font-size:18px">AdX Crypto</div>
        <div class="small-muted small">Earn USDT by watching rewarded ads</div>
      </div>
      <div style="text-align:right">
        <div id="userName" class="small-muted small">Welcome</div>
        <div id="todayDate" class="small-muted small">--</div>
      </div>
    </div>

    <div style="padding:18px; gap:16px; display:flex; flex-direction:column;">
      <div id="panel-home" class="panel">
        <div class="card mb-4">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div class="small-muted">Your Balance</div>
              <div id="balance" style="font-size:20px; font-weight:800">Loading...</div>
            </div>
            <div style="text-align:right">
              <div class="small-muted">Daily Ads</div>
              <div style="display:flex; align-items:center; gap:8px;">
                <div id="adsCount" style="font-weight:800; font-size:18px">0/100</div>
                <div id="adsRemainingPill" class="pill">100 left</div>
              </div>
            </div>
          </div>
          <div style="margin-top:14px;">
            <div class="small-muted">Progress</div>
            <div style="height:10px; background:rgba(2,6,23,0.04); border-radius:999px; margin-top:8px; overflow:hidden;">
              <div id="progressBar" style="height:100%; width:0%; background:linear-gradient(90deg,#0ea5e9,#3b82f6);"></div>
            </div>
          </div>
        </div>

        <div class="card mb-4" style="text-align:center;">
          <div style="font-weight:700; font-size:16px; margin-bottom:8px;">Watch rewarded ad</div>
          <div class="small-muted mb-4">Each ad = <strong>0.0002 USDT</strong>. Daily limit is <strong>100 ads</strong>.</div>
          <button id="watchBtn" class="btn-primary w-full">
            <span id="watchBtnText">🎬 Watch Ad & Earn 0.0002</span>
            <span id="watchBtnSpinner" class="spinner hidden"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
