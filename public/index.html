<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AdX Crypto — MiniApp</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{ font-family:Inter,sans-serif; display:flex; justify-content:center; padding:20px; background:linear-gradient(135deg,#07133b 0%,#0f172a 40%,#0b3a6f 100%);}
  .app{width:100%;max-width:520px;background:linear-gradient(180deg,rgba(255,255,255,0.95),rgba(243,246,255,0.95));border-radius:16px;box-shadow:0 20px 50px rgba(2,6,23,0.6);overflow:hidden;}
  .header{padding:18px 20px;background:linear-gradient(90deg,#0ea5e9,#3b82f6);color:white;display:flex;justify-content:space-between;align-items:center;}
  .card{padding:18px;border-radius:14px;background:linear-gradient(180deg,#ffffff,#f8fafc);box-shadow:0 8px 30px rgba(2,6,23,0.04);margin-bottom:16px;}
  .btn-primary{background:linear-gradient(90deg,#0ea5e9,#3b82f6);color:white;padding:12px 16px;border-radius:12px;font-weight:700;width:100%;display:flex;justify-content:center;align-items:center;gap:10px;}
  .pill{background:rgba(6,182,212,0.12);color:#065f68;padding:6px 10px;border-radius:999px;font-weight:600;font-size:13px;}
  .small-muted{color:#6b7280;font-size:13px;}
  .spinner{border:3px solid rgba(0,0,0,0.06);border-top:3px solid #3b82f6;width:20px;height:20px;border-radius:999px;animation:spin 1s linear infinite;display:inline-block;}
  .hidden{display:none;}
  @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <div style="font-weight:800; font-size:18px;">AdX Crypto</div>
      <div class="small-muted">Earn USDT by watching rewarded ads</div>
    </div>
    <div style="text-align:right;">
      <div id="userName" class="small-muted">Welcome</div>
      <div id="todayDate" class="small-muted">--</div>
    </div>
  </div>

  <div style="padding:18px;">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div class="small-muted">Your Balance</div>
          <div id="balance" style="font-size:20px;font-weight:800;">Loading...</div>
        </div>
        <div style="text-align:right;">
          <div class="small-muted">Daily Ads</div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div id="adsCount" style="font-weight:800;font-size:18px;">0/100</div>
            <div id="adsRemainingPill" class="pill">100 left</div>
          </div>
        </div>
      </div>
      <div style="margin-top:14px;">
        <div class="small-muted">Progress</div>
        <div style="height:10px;background:rgba(2,6,23,0.04);border-radius:999px;margin-top:8px;overflow:hidden;">
          <div id="progressBar" style="height:100%;width:0%;background:linear-gradient(90deg,#0ea5e9,#3b82f6);"></div>
        </div>
      </div>
    </div>

    <div class="card" style="text-align:center;">
      <div style="font-weight:700;font-size:16px;margin-bottom:8px;">Watch rewarded ad</div>
      <div class="small-muted mb-4">Each ad = <strong>0.0002 USDT</strong>. Daily limit is <strong>100 ads</strong>.</div>
      <button id="watchBtn" class="btn-primary">
        <span id="watchBtnText">🎬 Watch Ad & Earn 0.0002</span>
        <span id="watchBtnSpinner" class="spinner hidden"></span>
      </button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPABASE_URL = 'https://utexgcepqmwaxnstjhwl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0ZXhnY2VwcW13YXhuc3RqaHdsIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2MTE2MDI2MywiZXhwIjoyMDc2NzM2MjYzfQ.XXLnrjC1-4bzzvaoWPCqUOExDJlW1XyIZ_9aHIiEMbQ'; // ضعها في Vercel Environment لاحقاً
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const balanceEl = document.getElementById('balance');
const adsCountEl = document.getElementById('adsCount');
const adsRemainingPill = document.getElementById('adsRemainingPill');
const progressBar = document.getElementById('progressBar');
const watchBtn = document.getElementById('watchBtn');
const watchBtnSpinner = document.getElementById('watchBtnSpinner');
const watchBtnText = document.getElementById('watchBtnText');

const DAILY_LIMIT = 100;
let currentBalance = 0;
let todaysCount = 0;
let isProcessingAd = false;

const todayYMD = new Date().toISOString().slice(0,10);
document.getElementById('todayDate').innerText = todayYMD;

let userId = 'guest-' + Date.now();

async function setupUser(){
  const { data, error } = await supabase.from('users').select('*').eq('id', userId).single();
  if(error || !data){
    await supabase.from('users').insert({id:userId,balance:0,daily:{date:todayYMD,count:0},createdAt:Date.now()});
    currentBalance=0; todaysCount=0;
  } else {
    currentBalance=parseFloat(data.balance||0);
    if(data.daily?.date===todayYMD) todaysCount=parseInt(data.daily.count||0);
    else { todaysCount=0; await supabase.from('users').update({daily:{date:todayYMD,count:0}}).eq('id',userId);}
  }
  refreshUI();
}

function refreshUI(){
  balanceEl.innerText = currentBalance.toFixed(4)+' USDT';
  adsCountEl.innerText = todaysCount+'/'+DAILY_LIMIT;
  const remaining=Math.max(0,DAILY_LIMIT-todaysCount);
  adsRemainingPill.innerText = remaining+' left';
  progressBar.style.width = Math.min(100,Math.round((todaysCount/DAILY_LIMIT)*100))+'%';
  if(todaysCount>=DAILY_LIMIT) disableWatchButton(true,"You've reached today's limit");
  else disableWatchButton(false,'🎬 Watch Ad & Earn 0.0002');
}

function disableWatchButton(disable,text){
  if(disable){ watchBtn.setAttribute('disabled','true'); watchBtn.classList.add('opacity-60'); watchBtnText.innerText=text;}
  else{ watchBtn.removeAttribute('disabled'); watchBtn.classList.remove('opacity-60'); watchBtnText.innerText=text;}
}

async function creditReward(amount){
  currentBalance+=amount;
  todaysCount++;
  await supabase.from('users').update({balance:currentBalance,daily:{date:todayYMD,count:todaysCount}}).eq('id',userId);
  refreshUI();
}

watchBtn.addEventListener('click',async ()=>{
  if(isProcessingAd || todaysCount>=DAILY_LIMIT) return;
  isProcessingAd=true; watchBtnSpinner.classList.remove('hidden');
  try{ await new Promise(res=>setTimeout(res,1500)); await creditReward(0.0002);}
  catch(e){console.error(e);}
  finally{watchBtnSpinner.classList.add('hidden'); isProcessingAd=false;}
});

setupUser();
</script>
</body>
</html>
